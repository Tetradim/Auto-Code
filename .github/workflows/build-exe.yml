name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - consolidated

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Prepare static
        run: |
          if (Test-Path backend\static) { Remove-Item -Recurse -Force backend\static }
          New-Item -ItemType Directory -Force -Path backend\static | Out-Null
          Copy-Item -Recurse frontend\dist\* backend\static\
        shell: pwsh

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Install PyInstaller
        run: pip install pyinstaller pillow
        working-directory: backend

      - name: Create icon
        run: |
          python -c "from PIL import Image,ImageDraw;[(Image.new('RGBA',(s,s),(0,0,0,0)).save('app.ico',format='ICO') for s in [16,32,48,64,128,256]]"
          Copy-Item app.ico backend\app.ico -Force
        shell: pwsh

      - name: Create .env
        run: |
          "MONGO_URL=mongodb://localhost:27017`nDB_NAME=sentinel_edge`nCORS_ORIGINS=*`nDRY_RUN=true" | Out-File backend\.env -Encoding UTF8
        shell: pwsh

      - name: Build exe
        run: |
          pyinstaller --name SentinelEdge --onedir --console --icon app.ico --add-data static;static --add-data .env;. --hidden-import uvicorn --hidden-import motor --hidden-import pymongo --hidden-import yfinance --hidden-import prometheus_client --hidden-import talib --hidden-import numpy --hidden-import pandas --collect-all yfinance --collect-all motor --collect-all pymongo --collect-all talib --noconfirm server.py
        working-directory: backend
        shell: pwsh

      - name: Download MongoDB
        run: |
          Invoke-WebRequest -Uri https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-7.0.14.zip -OutFile mongodb.zip
          Expand-Archive -Path mongodb.zip -DestinationPath mongodb_temp -Force
          New-Item -ItemType Directory -Force -Path mongodb | Out-Null
          Copy-Item (Get-ChildItem -Path mongodb_temp -Recurse -Filter mongod.exe | Select -First 1).FullName mongodb\ -Force
        shell: pwsh

      - name: Download VC++/Inno
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
          choco install innosetup -y
        shell: pwsh

      - name: Create Inno script
        run: |
          '[Setup]' | Out-File setup.iss -Encoding ASCII
          'AppName=Sentinel Edge' | Add-Content setup.iss -Encoding ASCII
          'AppVersion=1.0.0' | Add-Content setup.iss -Encoding ASCII
          'OutputBaseFilename=SentinelEdge-Setup' | Add-Content setup.iss -Encoding ASCII
          'Source: "backend\dist\SentinelEdge\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs' | Add-Content setup.iss -Encoding ASCII
          'Source: "mongodb\*"; DestDir: "{app}\mongodb"; Flags: ignoreversion' | Add-Content setup.iss -Encoding ASCII
        shell: pwsh

      - name: Create launcher
        run: |
          '@echo off' | Out-File "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'title Sentinel Edge' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'cd /d "%~dp0"' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'if not exist "data" mkdir data' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'start "" /min "mongodb\mongod.exe" --dbpath "data" --port 27017' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'timeout /t 3 /nobreak > nul' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'SentinelEdge.exe' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
          'pause' | Add-Content "backend\dist\SentinelEdge\Start Sentinel Edge.bat" -Encoding ASCII
        shell: pwsh

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelEdge-Setup
          path: SentinelEdge-Setup.exe
          retention-days: 90