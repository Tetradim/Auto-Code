name: Auto Merge PR

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    name: Auto Merge Pull Request
    runs-on: ubuntu-latest
    if: github.event.pull_request.mergeable == true
    steps:
      - name: Check if PR can be merged
        id: check_merge
        run: |
          # Get the PR information
          pr_number=${{ github.event.pull_request.number }}
          
          # Check if all required status checks passed
          # This step will wait until all checks are complete
          echo "Checking if PR #$pr_number can be merged..."
          
          # Get the combined status for this commit
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status" | \
            jq -r '.state' > status_state.txt
          
          # Get the number of required checks that passed
          required_checks=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status" | \
            jq '.statuses | length')
          
          echo "Status: $(cat status_state.txt)"
          echo "Required checks: $required_checks"
          
          # Check if we can merge
          if grep -q "success" status_state.txt; then
            echo "can_merge=true" >> $GITHUB_OUTPUT
          else
            echo "can_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge the PR
        if: steps.check_merge.outputs.can_merge == 'true'
        run: |
          pr_number=${{ github.event.pull_request.number }}
          
          # Try to merge the PR using the GitHub CLI
          gh pr merge $pr_number --squash --auto --delete-branch || \
            echo "PR merge failed or already merged"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}