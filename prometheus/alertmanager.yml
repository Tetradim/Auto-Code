# Alertmanager Configuration — Sentinel Edge
global:
  resolve_timeout: 5m

route:
  # Group by alert name and correlation direction so related alerts
  # fire as a single notification
  group_by: ['alertname', 'direction']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'sentinel-webhook'

  routes:
    # Critical bearish correlation cluster — immediate, no grouping delay
    - matchers:
        - alertname = "BearishClusterOverride"
      receiver: 'sentinel-webhook'
      group_wait: 0s
      repeat_interval: 1h

    # Strong correlation clusters — short delay to allow grouping
    - matchers:
        - alertname = "StrongCorrelationCluster"
      receiver: 'sentinel-webhook'
      group_wait: 10s
      repeat_interval: 2h

    # Engine down — critical, page immediately
    - matchers:
        - severity = "critical"
        - alertname = "EdgeEngineDown"
      receiver: 'sentinel-webhook'
      group_wait: 0s
      repeat_interval: 30m

receivers:
  - name: 'sentinel-webhook'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/webhook/alert'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'sentinel-edge'
            # Mount a file containing the password, or set WEBHOOK_SECRET env var
            # in docker-compose.  Leave blank to disable auth in dev.
            password_file: '/etc/alertmanager/webhook_secret'

# Inhibit rules:
# If a critical alert fires for a given direction, suppress matching warnings
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['direction']

  # Don't fire CorrelationBearishCluster warning if BearishClusterOverride
  # (critical) is already active — they describe the same event
  - source_matchers:
      - alertname = "BearishClusterOverride"
    target_matchers:
      - alertname = "CorrelationBearishCluster"
    equal: ['direction']
