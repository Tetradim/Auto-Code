# Alertmanager Configuration
global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@sentinel-edge.com'

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'sentinel-default'
  routes:
    - match:
        severity: critical
      receiver: 'sentinel-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'sentinel-warning'

# Receivers
receivers:
  - name: 'sentinel-default'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/alerts/webhook'
        send_resolved: true

  - name: 'sentinel-critical'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/alerts/critical'
        send_resolved: true

  - name: 'sentinel-warning'
    webhook_configs:
      - url: 'http://sentinel-edge:8001/api/alerts/warning'
        send_resolved: true

# Inhibit rules
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
