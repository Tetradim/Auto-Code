groups:
  - name: sentinel_edge
    interval: 15s
    rules:

      # ── Engine health ───────────────────────────────────────────────────

      - alert: EdgeEngineDown
        expr: edge_engine_running == 0
        for: 1m
        labels:
          severity: critical
          service: sentinel-edge
        annotations:
          summary: "Sentinel Edge evaluation engine is not running"
          description: "edge_engine_running=0 for more than 1 minute."
          runbook_url: "docs/runbooks/engine-not-running.md"

      - alert: EdgeEnginePaused
        expr: edge_engine_paused == 1
        for: 10m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "Sentinel Edge engine has been paused for >10 minutes"
          runbook_url: "docs/runbooks/engine-paused.md"

      # ── Signal quality ──────────────────────────────────────────────────

      - alert: HighConsecutiveLosses
        expr: edge_consecutive_losses > 3
        for: 0m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "High consecutive loss streak on {{ $labels.symbol }}"
          description: "{{ $labels.symbol }} has {{ $value }} consecutive losses."
          runbook_url: "docs/runbooks/consecutive-losses.md"

      - alert: LowWinRate
        expr: edge_win_rate < 40
        for: 30m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "Win rate below 40% for {{ $labels.symbol }}"
          description: "Current win rate: {{ $value }}%"
          runbook_url: "docs/runbooks/low-win-rate.md"

      # ── Evaluation performance ──────────────────────────────────────────

      - alert: SlowEvaluation
        expr: histogram_quantile(0.99, rate(edge_eval_duration_seconds_bucket[5m])) > 1.0
        for: 3m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "Sentinel Edge evaluation p99 latency exceeds 1 second"
          description: "p99 evaluation duration = {{ $value }}s"
          runbook_url: "docs/runbooks/slow-evaluation.md"

      - alert: PriceFetchFailures
        expr: rate(price_fetch_failures_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "Price fetch failure rate elevated"
          description: "{{ $value }} failures/s over the last 5 minutes."
          runbook_url: "docs/runbooks/price-fetch-failures.md"

      # ── Correlation clusters ────────────────────────────────────────────

      - alert: CorrelationBearishCluster
        expr: increase(analyst_correlation_clusters_total{direction="bearish"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "BEARISH correlation cluster detected"
          description: "Multiple symbols breaking down simultaneously."
          runbook_url: "docs/runbooks/correlation-cluster.md"

      - alert: HighDrawdown
        expr: ticker_drawdown_percent > 8
        for: 0m
        labels:
          severity: critical
          service: sentinel-edge
        annotations:
          summary: "Drawdown exceeds 8% on {{ $labels.symbol }}"
          description: "Current drawdown: {{ $value }}%"

      # ── Core beta alerts (minimum required) ────────────────────────────────

      - alert: SentinelDown
        expr: up{job="sentinel-edge"} == 0
        for: 2m
        labels:
          severity: critical
          service: sentinel-edge
        annotations:
          summary: "Sentinel Edge bot is down"
          description: "The bot has been unresponsive for 2 minutes. Check if the process is running."
          runbook_url: "docs/runbooks/sidecar-down.md"

      - alert: StaleData
        expr: time() - sentinel_last_tick > 30
        for: 30s
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "Stale data - no ticks received"
          description: "No tick received in >30 seconds. Bot may be stuck."
          runbook_url: "docs/runbooks/stale-data.md"

      - alert: DrawdownExceeded
        expr: sentinel_drawdown_pct < -0.15
        for: 0m
        labels:
          severity: critical
          service: sentinel-edge
        annotations:
          summary: "Portfolio drawdown exceeded 15%"
          description: "Current drawdown: {{ $value | printf \"%.1f\" }}%. Consider stopping the bot."

  - name: frontend_experience_rules
    interval: 15s
    rules:

      - record: edge_frontend_rum:freshness_seconds
        expr: time() - edge_frontend_rum_last_received_timestamp_seconds

      - record: edge_frontend_rum:ingest_rate_per_minute
        expr: sum by (route) (rate(edge_frontend_rum_samples_total[5m])) * 60

      - record: edge_frontend_slow_interaction:p95_ms
        expr: histogram_quantile(0.95, sum by (le, route) (rate(edge_frontend_slow_interaction_duration_ms_bucket[5m])))

      - record: edge_frontend_long_task:p95_ms
        expr: histogram_quantile(0.95, sum by (le, route) (rate(edge_frontend_long_task_duration_ms_bucket[5m])))

  - name: api_observability_rules
    interval: 15s
    rules:

      - record: edge_rate_limit_rejections:rate5m
        expr: sum by (scope) (rate(edge_rate_limit_rejections_total[5m]))

      - record: edge_rate_limit_tracked_clients:max5m
        expr: max_over_time(edge_rate_limit_tracked_clients[5m])

  - name: automation_observability_rules
    interval: 15s
    rules:

      - record: edge_automation_handoffs:rate5m
        expr: sum by (action, mode, result, reason) (rate(edge_automation_handoffs_total[5m]))

  - name: api_slo_rules
    interval: 15s
    rules:

      - record: edge_api_availability:error_ratio5m
        expr: sum(increase(edge_api_calls_total{status!="success"}[5m])) / clamp_min(sum(increase(edge_api_calls_total[5m])), 1)

      - record: edge_api_availability:error_ratio30m
        expr: sum(increase(edge_api_calls_total{status!="success"}[30m])) / clamp_min(sum(increase(edge_api_calls_total[30m])), 1)

      - record: edge_api_availability:error_ratio1h
        expr: sum(increase(edge_api_calls_total{status!="success"}[1h])) / clamp_min(sum(increase(edge_api_calls_total[1h])), 1)

      - record: edge_api_availability:error_ratio6h
        expr: sum(increase(edge_api_calls_total{status!="success"}[6h])) / clamp_min(sum(increase(edge_api_calls_total[6h])), 1)

      - record: edge_api_availability:burn_rate5m
        expr: edge_api_availability:error_ratio5m / 0.01

      - record: edge_api_availability:burn_rate30m
        expr: edge_api_availability:error_ratio30m / 0.01

      - record: edge_api_availability:burn_rate1h
        expr: edge_api_availability:error_ratio1h / 0.01

      - record: edge_api_availability:burn_rate6h
        expr: edge_api_availability:error_ratio6h / 0.01

  # ── Analyst correlation rules ───────────────────────────────────────────

  - name: analyst_rules
    rules:

      - alert: StrongCorrelationCluster
        expr: analyst_correlation_clusters_total{strength="high"} > 1
        for: 30s
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "Strong {{ $labels.direction }} correlation cluster detected"
          description: >
            {{ $value }} high-strength {{ $labels.direction }} clusters detected.
            Multiple symbols breaking out in the same direction — potential market-wide move.
          runbook_url: "docs/runbooks/correlation-cluster.md"

      - alert: BearishClusterOverride
        expr: increase(analyst_correlation_clusters_total{direction="bearish",strength="high"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: sentinel-edge
        annotations:
          summary: "BEARISH high-strength cluster — Pulse override triggered"
          description: "Tighten-trailing-global override sent to Pulse."
          runbook_url: "docs/runbooks/correlation-cluster.md"

      - alert: HighPulseOverrideRate
        expr: rate(analyst_pulse_overrides_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          service: sentinel-edge
        annotations:
          summary: "High rate of Pulse overrides from analyst"
          description: "Override rate: {{ $value }}/s over last 5 minutes."

  # ── Sentinel trading alerts (market regime + correlation) ───────────────

  - name: sentinel_trading_alerts
    rules:

      # Critical bearish cluster — fires Pulse global risk reduction
      - alert: CriticalBearishCorrelation
        expr: analyst_correlation_clusters_total{direction="bearish", strength="high"} >= 3
        for: 90s
        labels:
          severity: critical
          action: "global_risk_reduction"
          cluster_id: "{{ $labels.direction }}"
          service: sentinel-edge
        annotations:
          summary: "CRITICAL: {{ $value }}-symbol bearish correlation cluster"
          description: >
            Strong bearish cluster detected across {{ $value }} symbols.
            Auto-tightening risk exposure across Pulse.

      # Bullish momentum regime — signals aggressive entry opportunity
      - alert: BullishMomentumRegime
        expr: rate(analyst_orb_breakouts_total{direction="bullish"}[5m]) > 8
        for: 3m
        labels:
          severity: warning
          action: "increase_aggression"
          service: sentinel-edge
        annotations:
          summary: "Strong bullish momentum regime detected"
          description: >
            Bullish ORB breakout rate = {{ $value }}/s (threshold: 8/5m).
            Multiple symbols breaking out — consider relaxing trailing stops.

      # Single symbol breakout — isolated event, not a cluster
      - alert: SingleSymbolBreakout
        expr: analyst_orb_breakouts_total{symbol!~"SPY|QQQ"} > 2
        for: 2m
        labels:
          severity: info
          service: sentinel-edge
        annotations:
          summary: "Isolated breakout on {{ $labels.symbol }}"
          description: >
            {{ $labels.symbol }} has {{ $value }} ORB breakouts (not a broad cluster).
            Direction: {{ $labels.direction }}, Timeframe: {{ $labels.timeframe }}.
